<script src="kirilim-hesap.js"></script>
<script>
var out = [], bad = 0, H = window.KirilimHesap;
function t(ad, f) { try { var r = f(); out.push((r === true ? "OK   " : "FAIL ") + ad + (r === true ? "" : " -> " + r)); if (r !== true) bad++; } catch (e) { out.push("FAIL " + ad + " -> " + e.message); bad++; } }
function eq(a, b) { var x = JSON.stringify(a), y = JSON.stringify(b); return x === y || x + " <> " + y; }
function yuv(m) { return m.map(function (r) { return r.map(function (x) { return Math.round(x * 10) / 10; }); }); }
function kir(kol, kodlar, ortusen) {
  return { kol: kol, ad: kol, kodlar: kodlar, etiketler: kodlar.map(function (k) { return k === "_T" ? "Toplam" : k; }), toplam: kodlar.indexOf("_T") >= 0, ortusen: !!ortusen };
}
function tablo(olcu, kirs, vec) { return { olcu: olcu, donemler: ["2024"], yerler: ["TR"], kirilimlar: kirs, v: { "2024": { TR: vec } } }; }
var R2 = { k1: "SEX", k2: "YAS", k3: "-" };

var TK = tablo("sayi", [kir("A", ["a0", "a1"]), kir("B", ["b0", "b1"]), kir("C", ["c0", "c1", "_T"])],

t("KirilimHesap tanimli", function () { return !!H || "yok"; });

t("kesit satirT toplanir (_T yok)", function () { return eq(H.kesit(T, "2024", "TR", R2, {})[0].satirT, [3, 7]); });
t("kesit sutunT _T satirindan", function () { return eq(H.kesit(T, "2024", "TR", R2, {})[0].sutunT, [4, 6]); });
t("kesit toplam", function () { return eq(H.kesit(T, "2024", "TR", R2, {})[0].toplam, 10); });
t("kesit secilmeyen kirilim toplanir (sayi, _T yok)", function () {
  var p = H.kesit(T3, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, {})[0];
  return eq(p.m, [[3, 7], [11, 15]]) === true && eq(p.toplam, 36) === true && eq(p.sabitlenen.length, 0);
});
t("kesit oran: secilmeyen sabitlenir, toplanmaz", function () {
  var p = H.kesit(T3o, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, {})[0];
  return eq(p.m, [[1, 3], [5, 7]]) === true && eq(p.sabitlenen.length, 1) === true && eq(p.sabitlenen[0].kol, "C") === true && eq(p.satirT, [null, null]);
});
t("kesit oran: sabit secimi", function () {
  return eq(H.kesit(T3o, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, { C: "c1" })[0].m, [[2, 4], [6, 8]]);
});
t("kesit panel: k3 her kod icin bir panel", function () {

});
t("kesit eksik hucre null", function () { return eq(H.kesit(TE, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, {})[0].m[0][1], null); });
t("kesit eksik hucre satirT toplamda atlanir", function () { return eq(H.kesit(TE, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, {})[0].satirT, [1, 7]); });
t("kesit yer yok -> bos dizi", function () { return eq(H.kesit(T, "2024", "TR999", R2, {}), []); });

t("toplamAnlamsiz kırılım: _T kullanılmaz, ilke sabitlenir", function () {

t("satır toplamı: sütun _T boşsa satırdan toplanır", function () { return eq(H.kesit(TB2, "2024", "TR", { k1: "A", k2: "B", k3: "-" }, {})[0].satirT, [3, 7]); });

});

});

});
var TZ = { olcu: "sayi", donemler: ["2023", "2024"], donemEtiket: ["2023", "2024"], yerler: ["TR"], kirilimlar: [kir("A", ["a0", "a1"]), kir("B", ["b0", "b1"])],

/* --- gruplama kuralı --- */
function dt(kod, baslik, cog, kollar, olcu) { return { kod: kod, baslik: baslik, olcu: olcu || "sayi", cografya: cog, kirilimlar: kollar.map(function (k) { return { kol: k, ad: k === "V" ? "Değer" : k }; }) }; }
var NUF = [dt("t16", "Nüfus: a ve b", "il", ["SEX", "YAS"]), dt("t14", "Nüfus: c ve a", "il", ["YER", "SEX"]), dt("t15", "Nüfus: c, a, b", "tr", ["YER", "SEX", "YAS"])];

  var g = H.gruplar(NUF); return eq([g.length, g[0].grup, g[0].baslik, g[0].kod, g[0].boyutlar.map(function (b) { return b.kol; }), g[0].varsayilan], [1, true, "Nüfus", "g_t16", ["SEX", "YAS", "YER"], ["SEX", "YAS"]]);
});
t("gruplar: aynı kırılım kümesi (eylül/kümülatif) gruplanmaz", function () {
  var g = H.gruplar([dt("e", "Dış ticaret: x", "tr", ["A", "B"]), dt("k", "Dış ticaret: y", "tr", ["B", "A"])]); return eq(g.map(function (x) { return x.grup; }), [false, false]);
});
t("gruplar: ':' yoksa ya da ölçü farklıysa gruplanmaz; 'Değer' sahte kırılım sayılmaz", function () {

  return eq(g.map(function (x) { return x.kod; }), ["a", "b", "c", "d", "g_e"]);
});
t("gruplar: grup, ilk üyesinin yerinde durur; sıra korunur", function () {
