<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kırılım Gezgini · Enstitü Portal</title>
<meta name="description" content="TÜİK tablolarının kırılımlarını (cinsiyet, yaş grubu, eğitim, medeni durum…) kendiniz seçip çaprazlayın: ısı matrisi, çubuk ve tablo olarak görün.">
<meta name="theme-color" content="#d8232a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kirilim.css">
</head>
<body>
<header class="ust"><div class="ust-ic">
  <a class="marka" href="./"><span class="kare" aria-hidden="true"><i></i><i class="b"></i></span>Enstitü Portal</a>
  <span class="sayfa">Kırılım Gezgini</span>
  <a class="geri" href="./">← Portala dön</a>
</div></header>

<main class="ana">
  <section class="panel">
    <h1 id="baslik">Kırılım Gezgini</h1>
    <p class="alt" id="aciklama">Bir konu ve tablo seçin, tablonun kırılımlarından ikisini ya da üçünü çaprazlayın, çıktının biçimini kendiniz belirleyin.</p>
  </section>

  <section class="panel" aria-label="Seçimler">
    <div class="konular" id="konu" role="tablist" aria-label="Konu"></div>
    <div class="kontrol">
      <div id="tablow"><label for="tablo">Tablo</label><select id="tablo"></select></div>
      <div id="k1w"><label for="k1">Kırılım 1 (satır)</label><select id="k1"></select></div>
      <div id="k2w"><label for="k2">Kırılım 2 (sütun)</label><select id="k2"></select></div>
      <div id="k3w"><label for="k3">Kırılım 3 (paneller)</label><select id="k3"></select></div>
      <div id="yerw" hidden><label for="yer">Yer</label><select id="yer"></select></div>
      <div id="donemw" class="yil" hidden><span>Dönem</span><input type="range" id="donem" min="0" max="0" step="1" aria-label="Dönem"><b id="donemYazi"></b></div>
      <div id="sutunw" hidden><label for="sutun">Gösterilecek sütun</label><select id="sutun"></select></div>
      <div><span class="etk">Çıktı</span><div class="seg" id="cikti" role="group" aria-label="Çıktı"></div></div>
      <div><span class="etk">Değer</span><div class="seg" id="deger" role="group" aria-label="Değer"><button data-d="sayi" aria-pressed="true">Sayı</button><button data-d="pay" aria-pressed="false">Satır payı (%)</button></div></div>
      <label class="onay" id="karsw" hidden><input type="checkbox" id="kars"> Türkiye ile karşılaştır</label>
    </div>
    <p class="alt" id="ipucu" style="margin-top:10px"></p>
  </section>

  <section class="panel" aria-live="polite">
    <div id="sonuc"></div>
    <div class="lejant" id="lejant"></div>
    <div id="notlar"></div>
  </section>
</main>
<footer class="altbilgi" id="kaynak"></footer>
<div class="ipucu" id="balon"></div>

<script src="veri/kirilim_dizin.js"></script>
<script src="kirilim-hesap.js"></script>
<script src="kirilim.js"></script>
</body>
</html>
