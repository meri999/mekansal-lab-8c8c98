<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>test</title></head><body><pre id="o"></pre>
<script src="veri/veri.js"></script><script src="giris-hesap.js"></script>
<script>
var out=[],bad=0;
function t(ad,f){try{var r=f();out.push((r===true?"OK   ":"FAIL ")+ad+(r===true?"":" -> "+r));if(r!==true)bad++}catch(e){out.push("FAIL "+ad+" -> "+e.message);bad++}}
var Y=(window.VERI||{}).yerler||[],H=window.GirisHesap;
function adi(k){return Y.filter(function(y){return y.kod===k})[0].ad_tr}
t("GirisHesap tanimli",function(){return !!H||"yok"});
t("bul sanliurfa",function(){var r=H.bul("sanliurfa",Y);return (r[0]&&r[0].ad==="Şanlıurfa")||JSON.stringify(r)});
t("bul ŞANLIURFA",function(){var r=H.bul("ŞANLIURFA",Y);return (r[0]&&r[0].ad==="Şanlıurfa")||JSON.stringify(r)});
t("bul ığdır",function(){var r=H.bul("ığdır",Y);return (r[0]&&/ğdır$/.test(r[0].ad))||JSON.stringify(r)});
t("bul mus: Muş önce, Gümüşhane sonra",function(){var r=H.bul("mus",Y);return (r[0]&&r[0].ad==="Muş")||JSON.stringify(r.map(function(x){return x.ad}))});
t("bul kar: baştan eşleşenler önce",function(){var r=H.bul("kar",Y),n=r.length,i=0;while(i<n&&/^kar/i.test(H.katla(r[i].ad)))i++;return (i>=3&&r.slice(i).every(function(x){return !/^kar/.test(H.katla(x.ad))}))||JSON.stringify(r.map(function(x){return x.ad}))});
t("bul bos metin",function(){return H.bul("",Y).length===0||"bos olmali"});
t("sirala null atlar",function(){var r=H.sirala({a:1,b:null,c:3},{a:"A",b:"B",c:"C"},2,true);return (r.length===2&&r[0].ad==="A"&&r[1].ad==="C")||JSON.stringify(r)});
t("sirala azalan",function(){var r=H.sirala({a:1,c:3},{a:"A",c:"C"},1,false);return r[0].ad==="C"||JSON.stringify(r)});
var g=(VERI.gostergeler||[]).filter(function(x){return x.baslik==="Nüfus"})[0];
t("sonYil nufus",function(){var s=H.sonYil(g);return (s&&s.yil===g.yillar[s.i]&&s.i>=0)||JSON.stringify(s)});
t("ilDegerleri 70+ il",function(){var s=H.sonYil(g),d=H.ilDegerleri(g,s.i),n=Object.keys(d).filter(function(k){return d[k]!==null}).length;return n>=70||n});
t("fark nufus il",function(){var s=H.sonYil(g),f=H.fark(g,s.i,1),k=Object.keys(f)[0];return (typeof f[k]==="number"||f[k]===null)||"tip"});
t("sonYil son yil <70 ise geriye",function(){var n=g.yillar.length,v={};Object.keys(g.veri).forEach(function(k){v[k]=g.veri[k].slice()});
  Object.keys(v).forEach(function(k,j){if(k!=="TR"&&j%2===0)v[k][n-1]=null});
  var s=H.sonYil({yillar:g.yillar,veri:v});return s.i<n-1||"geri gitmedi"});
t("turkiye",function(){var s=H.sonYil(g);var v=H.turkiye(g,s.i);return typeof v==="number"||v});
var K={gostergeler:VERI.gostergeler,yerler:Y,araclar:[{ad:"Kırılım Gezgini",href:"kirilim-matrisi.html",aciklama:"Seç, çaprazla",pasif:false},{ad:"İl karnesi",href:"#",aciklama:"Bir ilin karnesi",pasif:true},{ad:"Göç ağı",href:"goc-agi.html",aciklama:"İller arası akış",pasif:false}]};
var izmir=Y.filter(function(y){return y.ad_tr==="İzmir"&&y.duzey==="il"})[0];
t("araBul tanimli",function(){return typeof H.araBul==="function"||"yok"});
t("araBul bos",function(){return H.araBul("",K).length===0||"bos olmali"});
t("araBul bosluk",function(){return H.araBul("   ",K).length===0||"bos olmali"});
t("araBul eslesmeyen",function(){return H.araBul("zzzqq",K).length===0||"bos olmali"});
t("araBul dogurganlik gosterge",function(){var r=H.araBul("dogurganlik",K);return (r[0]&&r[0].tur==="gosterge"&&/oğurganlık/i.test(r[0].ad))||JSON.stringify(r[0])});
t("araBul izmir il",function(){var r=H.araBul("izmir",K);return (r[0]&&r[0].tur==="il"&&r[0].ad==="İzmir"&&r[0].href==="veri-portali.html#yer="+izmir.kod)||JSON.stringify(r[0])});
t("araBul izmir issizlik birlesik",function(){var r=H.araBul("izmir issizlik",K);return (r[0]&&r[0].tur==="birlesik"&&r[0].href==="veri-portali.html#g=g38&yer="+izmir.kod)||JSON.stringify(r[0])});
t("araBul kirilim arac",function(){var r=H.araBul("kirilim",K);return (r[0]&&r[0].tur==="arac"&&r[0].href==="kirilim-matrisi.html"&&r[0].pasif===false)||JSON.stringify(r[0])});
t("araBul pasif arac",function(){var r=H.araBul("karnesi",K);return (r[0]&&r[0].tur==="arac"&&r[0].pasif===true)||JSON.stringify(r[0])});
t("araBul issizlik tek baslik",function(){var r=H.araBul("issizlik",K).filter(function(x){return x.ad==="İşsizlik oranı"});return r.length===1||r.length});
t("araBul en cok 8",function(){return H.araBul("nufus",K).length<=8||"cok"});
t("araBul sadece_tr il ile birlesmez",function(){var r=H.araBul("izmir issizlik",K).filter(function(x){return /g113$|g113&/.test(x.href)});return r.length===0||"g113 geldi"});
var D10={};for(var q=1;q<=10;q++)D10["k"+q]=q;
t("sinifla bes sinif",function(){var r=H.sinifla(D10);return (r.sinif.k1===0&&r.sinif.k10===4&&r.esik.length===4)||JSON.stringify(r)});
t("sinifla null",function(){var r=H.sinifla({a:1,b:null,c:2});return r.sinif.b===null||JSON.stringify(r)});
t("sinifla bos",function(){var a=H.sinifla({}),b=H.sinifla({a:null});return (a.esik.length===0&&b.esik.length===0&&b.sinif.a===null)||"bos"});
t("sinifla esit degerler",function(){var r=H.sinifla({a:5,b:5,c:5});return (r.sinif.a===r.sinif.b&&r.sinif.b===r.sinif.c)||JSON.stringify(r)});
document.getElementById("o").textContent=out.join("\n");document.title=(bad?"FAIL ":"PASS ")+(out.length-bad)+"/"+out.length;
</script></body></html>
