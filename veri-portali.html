<style>

.srk{display:flex;align-items:center;gap:10px;width:100%;background:var(--kart);border:1px solid var(--cizgi);border-radius:8px;padding:6px 10px;margin-bottom:4px;cursor:pointer;font:inherit;color:inherit;text-align:left}

.srk .no{width:22px;color:var(--soluk);font-size:12px}.srk .ad{flex:1}.srk b{font-variant-numeric:tabular-nums}
.spark{width:100%;height:26px;margin-top:4px;color:var(--vurgu)}
.k-kir{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--vurgu-koyu);background:var(--vurgu-acik);border-radius:12px;padding:2px 10px;cursor:pointer}

.k-kaynak{font-size:11px;color:#8a97a1;margin-top:3px;line-height:1.25}
.bos{padding:20px 4px;color:var(--soluk)}
.alt{max-width:1320px;margin:0 auto;padding:6px 16px 28px;font-size:12.5px;color:var(--soluk)}
.alt a{color:var(--vurgu-koyu)}
@media(max-width:920px){.ana{grid-template-columns:minmax(0,1fr)}.harita-kart{position:static}.ara{margin-left:0;width:100%}.ara select{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 TRALT=[["uretim","Üretim"],["fiyat","Fiyatlar"],["isgucu","İşgücü"],["dis","Dış ticaret"],["konut","Konut ve taşıt"],["guven","Güven"],["tarim","Tarım ve hayvancılık"],["sanayi","Sanayi ve hizmet"],["finans","Finans"],["girisim","Girişimcilik"],["kamu","Kamu"]], BOLUM={}, ALTLAR={}, ALTAD={};
